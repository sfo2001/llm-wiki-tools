[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-tools"
dynamic = ["version"]
description = "CLI toolchain (lwt) for LLM-maintained personal knowledge bases — ingest, search, lint, and deploy a compounding markdown wiki."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Förster", email = "103369858+sfo2001@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["llm", "wiki", "knowledge-base", "rag", "markdown", "cli", "mkdocs", "bm25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=1.9",
    "html2text>=2024.2",
    "requests>=2.31",
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "python-pptx>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fpdf2>=2.7",
    "responses>=0.25",
]
mkdocs = [
    "mkdocs-material>=9.5",
    "mkdocs-roamlinks-plugin>=0.3",
]

[project.urls]
Homepage = "https://github.com/sfo2001/llm-wiki-tools"
Repository = "https://github.com/sfo2001/llm-wiki-tools"
Issues = "https://github.com/sfo2001/llm-wiki-tools/issues"

[project.scripts]
lwt = "llm_wiki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
