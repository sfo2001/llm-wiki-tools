[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-tools"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=1.9",
    "html2text>=2024.2",
    "requests>=2.31",
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "python-pptx>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fpdf2>=2.7",
    "responses>=0.25",
]
mkdocs = [
    "mkdocs-material>=9.5",
    "mkdocs-roamlinks-plugin>=0.3",
]

[project.scripts]
lwt = "llm_wiki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
