name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs (not floating tags) so a hijacked
# or re-pointed tag cannot silently swap the action. Trailing comment = the tag
# the SHA corresponds to.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0  # hatch-vcs needs full history for versioning

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    # Non-blocking: surfaces known CVEs (incl. transitive deps we don't directly
    # control) as a warning without gating merges. Flip to a hard gate by removing
    # this line once the dependency tree is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --desc
